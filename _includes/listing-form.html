<form class="listing-form" action="{{ site.mailchimp.action }}" method="post" target="_blank" novalidate>
  <div class="field"><label for="mce-EMAIL">Email <span aria-hidden="true">*</span></label><input type="email" name="EMAIL" id="mce-EMAIL" required autocomplete="email"></div>
  <div class="field-row">
    <div class="field"><label for="mce-FNAME">First name</label><input type="text" name="FNAME" id="mce-FNAME" autocomplete="given-name"></div>
    <div class="field"><label for="mce-LNAME">Last name</label><input type="text" name="LNAME" id="mce-LNAME" autocomplete="family-name"></div>
  </div>
  <div class="field"><label for="mce-COMPANY">Convention or company</label><input type="text" name="COMPANY" id="mce-COMPANY" autocomplete="organization"></div>
  <input type="hidden" name="tags" value="{{ site.mailchimp.listing_tag }}">
  <div class="hp" aria-hidden="true"><input type="text" name="{{ site.mailchimp.honeypot }}" tabindex="-1" value=""></div>
  <button class="btn btn-primary" type="submit" data-track="lead" data-track-label="{{ include.source | default: 'listing_form' }}">Get in touch</button>
  <p class="fine">We reply within a few business days. No spam, unsubscribe anytime.</p>
</form>
