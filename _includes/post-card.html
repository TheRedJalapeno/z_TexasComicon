{%- assign p = include.post -%}
<article class="card post-card{% if p.sponsored %} is-sponsored{% endif %}">
  <div class="card-body">
    <p class="card-meta"><time datetime="{{ p.date | date: '%Y-%m-%d' }}">{{ p.date | date: '%b %-d, %Y' }}</time>{% if p.sponsored %}<span class="tag tag-sponsored">Sponsored</span>{% endif %}</p>
    <h3 class="card-title"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    <p class="card-desc">{{ p.description | default: p.excerpt | strip_html | truncate: 160 }}</p>
  </div>
</article>
